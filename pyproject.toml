[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2gif"
version = "0.5.1"
description = "Video-to-GIF converter utilizing two-pass FFmpeg palette generation and SSIM/PSNR benchmarking."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Anthony Dee"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "twine>=4.0.0",
    "build>=0.10.0"
]

[project.scripts]
vid2gif = "vid2gif.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
