[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2gif"
version = "0.1.0"
description = "Video to GIF conversion utility and Python port"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
